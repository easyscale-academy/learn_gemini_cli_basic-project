[env]

[tools]
gemini = "latest"
python = "3.12"
ruff = "latest"
uv = "latest"

# === Tasks
[tasks.venv-create]
description = "Create Python virtual environment (.venv)"
run = "uv venv"

[tasks.venv-remove]
description = "Remove Python virtual environment folder (.venv)"
run = "rm -r .venv"

[tasks.inst]
description = "Install Python dependencies via uv"
run = "uv sync --all-extras"

[tasks.app]
description = "Run Streamlit app locally"
run = ".venv/bin/streamlit run app.py"
