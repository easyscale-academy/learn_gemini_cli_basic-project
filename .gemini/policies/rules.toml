[[rule]]
toolName = ["write_file", "edit_file", "replace"]
filePattern = [
    ".gemini/settings.json",
    ".gemini/commands/*.toml",
    ".gemini/policies/*.toml",
    ".gemini/skills/*/SKILL.md",
    ".gemini/*.md",
    "tests/**/*.py",
    "expense_analyzer/**/*.py",
    "scripts/**/*.py",
    "tmp/**/*.md",
]
decision = "allow"
priority = 100

[[rule]]
toolName = "run_shell_command"
commandRegex = "^(\\.venv/bin/python|python) .*tests/.*\\.py$"
decision = "allow"
priority = 100

[[rule]]
toolName = "run_shell_command"
commandRegex = "^mise .*"
decision = "allow"
priority = 100

[[rule]]
toolName = "run_shell_command"
commandRegex = "^(\\.venv/bin/pytest|pytest) .*"
decision = "allow"
priority = 100

[[rule]]
toolName = "delete_file"
decision = "deny"
priority = 200
deny_message = "File deletion is disabled for safety reasons."

[[rule]]
toolName = "run_shell_command"
commandRegex = ".*rm -rf.*"
decision = "deny"
priority = 200
